[buildout]
extends =
	https://dist.plone.org/release/6.1-latest/versions.cfg
    https://raw.github.com/collective/buildout.plonetest/master/qa.cfg
    base.cfg

extensions =
    mr.developer

find-links =
    https://dist.plone.org/release/6.1-latest/

parts =
	instance
	omelette
    test
    pytest

eggs =
	collective.ai.core
	collective.ai.summarizer
    collective.ai.classification
    iw.debug
    shutup

zcml =
    iw.debug

show-picked-versions = true

plone-user = admin:admin

auto-checkout =
	collective.ai.summarizer
    collective.ai.classification

[instance]
initialization = import shutup; shutup.please()
recipe = plone.recipe.zope2instance
user = ${buildout:plone-user}
eggs =
    Plone
    plone.app.upgrade
    ${buildout:eggs}
zodb-temporary-storage = off
deprecation-warnings = on
environment-vars =
    zope_i18n_compile_mo_files true
zcml =
    ${buildout:zcml}

[test]
initialization = import shutup; shutup.please()
recipe = zc.recipe.testrunner
defaults = ['--auto-color', '--auto-progress', '-s', 'collective.ai.core']
eggs =
    Plone
    collective.ai.core [test]
    ${buildout:eggs}
environment = testenv

[pytest]
initialization = import shutup; shutup.please()
recipe = zc.recipe.egg
eggs =
    Plone
    collective.ai.core [test]
    ${buildout:eggs}
relative-paths = true
entry-points = pytest=pytest:main

[testenv]
zope_i18n_compile_mo_files = true
TZ = UTC

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}
